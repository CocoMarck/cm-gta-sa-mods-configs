; GTA SA Minecraft settings
; key codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
[Keys]
; F6: Minecraft mod on / off
ToggleMode=0x75
; E: inventory
Inventory=0x45
; Q: drop the held item
Drop=0x51
; F7: survival / creative
GameMode=0x76
; F5: camera (first person, third person back / front)
Camera=0x74
; F8: CJ <-> Steve
Steve=0x77
; F: swap main hand and off hand (enters a car when one is near)
SwapHands=0x46
; F9: GTA radar on / off
Radar=0x78

[Settings]
; language of everything Minecraft says: en = English, tr = Turkish (also in the menu: Language...)
Language=en
; 0 = automatic, 1-6 = GUI size
GuiScale=0
; how far blocks are drawn (metres)
RenderDistance=160
; block collision radius (metres)
CollisionRadius=48
MouseSensitivity=1.0
; 1 = the inventory is kept when you die
KeepInventory=1
; 1 = the Minecraft mod is on when the game starts
StartEnabled=1
; GTA radar at the bottom left (F9 in the game)
ShowRadar=1
; 0 = survival, 1 = creative
StartGameMode=0
; blocks can be collected from the GTA map (ground, rock, trees)
MineGtaWorld=1
; GTA explosions break blocks
ExplosionsBreakBlocks=1
; 1 = start as Steve
StartAsSteve=0
; field of view (Minecraft's FOV slider, 30-110). 0 = GTA's own
FOV=70
; 1 = Minecraft keys (Space jump, Ctrl sprint, Shift sneak). 0 = GTA keys
MinecraftControls=1
; view bobbing while walking (first person)
ViewBobbing=1
; 1 = pedestrians look like villagers, police like pillagers
PedSkins=1
; 1 = cows, pigs, sheep and chickens spawn
Animals=1
; most animals around at the same time
MaxAnimals=14
; 1 = creepers come out at night
Monsters=1
; most creepers around at the same time
MaxMonsters=4
; 1 = police and gangs shoot arrows instead of guns (the helicopter too)
NpcArrows=1
; 1 = Minecraft physics (walking, jumping, falling, swimming). 0 = GTA physics
MinecraftPhysics=1
; 1 = dug holes show in the GTA ground. Set 0 if the picture breaks
GroundHoles=1
; 1 = GTA buildings, roofs and rocks can be broken into, block by block
BreakBuildings=1
; 1 = title screen, world list and pause menu look like Minecraft's. 0 = GTA's own menu
MinecraftMenu=1
; volume of the Minecraft sounds, 0.0 - 1.0 (GTA's effects volume counts too)
SoundVolume=1.0
; background of the Minecraft menus: minecraft = the panorama, gta = GTA's own artwork
MenuBackground=minecraft
