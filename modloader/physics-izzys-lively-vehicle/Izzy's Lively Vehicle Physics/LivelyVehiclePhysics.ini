; izzy's lively vehicle physics settings!
; 1 = on, 0 = off

[Vehicle Physics]
; tilt cars forward and backwards in the air like a rally driver (look it up!)
AirControl=1
; shooting the tyres of a fast car makes it spin out or even flip
ShotTyresFlip=1
; Softer Suspension and Reactions
SoftSuspension=1
; the chassis shakes and twists when revving and changing gears
ChassisShake=1
; Fast and Furious Styled Wheelies
MuscleWheelie=1
; cars with an open differential will do a one-wheeled burnout
OpenDiff=1
; the new bike lean forward
BikeLeanForward=1
; the new bike burnouts and donuts
BikeDonuts=1
; big crashes and drops can break a wheel's suspension until you repair the car
BrokenSuspension=1

[Vehicle Effects]
; how much smoke, dust and sparks you get: high, medium or low (low = more fps)
Quality=high
; flipped cars can catch fire
FlippedCarsCatchFire=1
; driving on a burst tyre for a while sets it on fire
BurstTyresCatchFire=1

[Solid Doors+]
; self explanatory :P also applies to the trunk and hood
SolidDoors=1
; vehicle glass breaks individually, disabling this might fix non-glass car parts displaying the broken glass texture if you get that for some reason
BreakableGlass=1
; cj closes both front doors while driving when you let off the gas
CloseBothDoors=1

[Classes]
; if one of your addon cars feels weird you can tell the mod what kind of car it is here
; write the model name from vehicles.ide (or its id), then = and the class
; classes: super, sports, muscle, suv, luxury, sedan, van, truck, bus
;infernus=super
