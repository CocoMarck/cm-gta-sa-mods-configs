; Ped Bullet Holes SA
; Loaded once when the game starts. Restart the game to apply changes.
; Decimal values use a dot. All time values below are in milliseconds.

[BulletHoles]
; 0 disables only bullet-hole decals; the headshot module remains separate.
Enabled=1
; Safe ranges: MaxPerPed 1-64, MaxGlobal 1-512.
MaxPerPed=32
MaxGlobal=128
; 1.00 keeps the current size. Range: 0.25-4.00.
SizeMultiplier=1.00
; 5.0 produces a random range from 95% to 105%. Range: 0-50.
SizeVariationPercent=5.0
LifetimeMs=40000
; Set to 0 to remove the decal instantly at the end of LifetimeMs.
FadeDurationMs=10000
; Surface offset in meters (0-0.02). Existing default: 4 mm.
SurfaceOffset=0.004
; Depth bias: -0.001 to 0; slope bias: -4 to 0. Zero disables each bias.
; More negative values reduce fighting but can show through nearby surfaces.
DepthBias=-0.00020
SlopeDepthBias=-1.5

[BloodPools]
; Enabled=0 keeps vanilla/IMFX pool producers and disables custom pools.
Enabled=1
; Allows the extra pool created below a removed head to be disabled separately.
CreateHeadPool=1
; 0 leaves vanilla/IMFX blood producers available for other blood mods.
; Keep 1 with custom pools to avoid drawing both effects on the same floor.
ReplaceVanillaPools=1
; MaxGlobal supports up to 15 at 65x65 and may be reduced for larger meshes.
MaxGlobal=12
; Visual mesh: 16-129, rounded up to 17,33,49,65,81,97,113,129.
; Alignment prevents triangles crossing the fixed 17x17 surface grid.
MeshResolution=65
; Radii in meters, before the random scale variation.
BodyRadius=0.910
HeadRadius=0.616
SizeVariationPercent=6.0
BodyGrowthMs=8200
HeadGrowthMs=5800
LifetimeMs=120000
; Set to 0 to remove the pool instantly at the end of LifetimeMs.
FadeDurationMs=20000
; Maximum render distance in meters. Range: 10-300.
; Pools fade smoothly over the final 20% of this distance.
DrawDistance=80.0
; Surface offset in meters (0-0.03). Existing default: 8 mm.
SurfaceOffset=0.008
; Depth bias: -0.001 to 0; slope bias: -4 to 0. Zero disables each bias.
DepthBias=-0.00020
SlopeDepthBias=-1.5

[BloodDrops]
; Experimental mesh receivers. 0 disables their capture and rendering.
; Coplanar animated decals; set each option to 1 to test the dynamic receivers.
; Dynamic receivers do not use the BloodPools surface offset/depth bias.
EnableOnVehicles=1
; Covers CJ, nearby NPCs and the emitting ped.
EnableOnPeds=1
; Held player/CJ weapon mesh; independent limits in [WeaponBloodDrops].
EnableOnWeapons=1
; Ground marks use independent textures pbh_drop_01..06 in the TXD.
; Replace those six entries to change drops without changing corpse pools.
Enabled=1
MaxGlobal=128
SizeMultiplier=4.0
; Capped at half the shorter pool growth time to keep drops faster.
GrowthMs=1000
LifetimeMs=120000
FadeDurationMs=10000
DrawDistance=60.0

[WeaponBloodDrops]
; Separate from BloodDrops MaxGlobal; ranges: global 1-128, per weapon 1-64.
; Each hand has its own MaxPerWeapon limit when dual wielding.
MaxGlobal=64
MaxPerWeapon=48
; Maximum nearby DFF frames/meshes covered by one blood event (1-32).
; Larger meshes are considered first, so small bolts/accessories cannot consume the limit.
MaxFragmentsPerEvent=16
; Maximum emission-to-weapon-mesh distance, in meters (0.5-3.0).
CaptureRadius=3.0
; Weapon stain scale (0.25-2.0); 1.0 uses patches up to 26 cm radius.
SizeMultiplier=1.0
; Native melee/body/continuous emissions considered for weapons (0.0-1.0).
; Independent of [MeleeBleeding] Rate, which still controls other receivers.
MeleeCaptureRate=0.05
; Uses BloodDrops lifetime/fade/draw distance and EnableOnWeapons.
; Two weapon captures per frame, independent of ped/vehicle captures.

[BloodSplatter]
; Independent wall exit spray, using pbh_splatter_01..06.
Enabled=1
MaxGlobal=16
SizeMultiplier=4.0
GrowthMs=1000
LifetimeMs=120000
FadeDurationMs=10000
DrawDistance=60.0
; Maximum victim-to-wall trace length, in meters.
WallDistance=3.6
; Per victim; limits automatic fire before tracing surfaces.
IntervalMs=300
SameAreaIntervalMs=1200
SameAreaRadius=0.60

[Headshots]
; Disables only headshots performed after the ped is already dead.
PostMortemEnabled=1
; In meters; used when a ragdoll does not preserve the vanilla head IDs.
FallbackRadius=0.20

[MeleeBleeding]
; Fraction of native melee blood-drop decals to keep (0.0-1.0).
; 0.0 disables these emissions, 0.05 keeps 5%, 1.0 keeps 100% (vanilla rate).
; Covers melee hit FX, body bleeding FX and continuous ground dripping.
; Added weapons using these native paths are covered. Airborne FX are unchanged.
Rate=0.05

[Debug]
; The overlay remains in the code, but the F7 hotkey is disabled in this build.
EnabledByDefault=0
