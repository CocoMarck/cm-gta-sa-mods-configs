; Soundize by Junior_Djjr - MixMods.com.br - Patreon.com/c/djjr

[Settings]
GlobalVolume = 1.0
GlobalReverbIntensity = 1.0
FmodLogo = 1     ; Projects using FMOD Studio must include an in-app credit line and the FMOD logo.
ServerMinimizedToSystemTray = 1   ; If set to "1", the server window will be hidden on system tray, you need to double click to show the window again.
DebugFlags = 3   ; 0=None, 1=Errors, 2=Warnings, 3=Errors+Warnings, 4=Infos, 7=All

[System]
UpdateMode = 1
BufferLength = 512
NumBuffers = 4

[Modules]
EnableVehicles = 1
EnableAmbient = 1


[Vehicles]
Volume = 0.8

VolumeNPCsMult = 0.9
VolumeInteriorMult = 0.6

PreLoad = 0

MaxDistance = 180.0

TunnelOcclusionDistanceStart = 30.0   ; full reverb up to this distance (m)
TunnelOcclusionDistanceEnd   = 100.0  ; fully occluded from this distance
TunnelOcclusionHeightStart   = 3.0    ; height difference before occlusion starts
TunnelOcclusionHeightEnd     = 15.0   ; fully occluded at this height difference
TunnelOccludedVolume         = 0.5    ; volume multiplier when fully occluded

EnableOnCars = 1
EnableOnBikes = 1
EnableOnPlanes = 1
EnableOnHelis = 1
EnableOnBoats = 1

RPMmode = 0   ; 0 = Sport (high), 1 = Road (low)
CutGasPedalOnGearChange = 2  ; Set 1 if you want to cut accelerator pedal while the car/bike is changing gears. Set 2 to enable only on singleplayer (ignoring on SAMP).
UseBackfireForAll = 0   ; Set 1 if you want all supported vehicles using backfire by default
UseTurboForAll = 0      ; Set 1 if you want all supported vehicles using turbo by default


[Ambient]
Volume = 0.6
TrafficVolume = 0.7
CrowdVolume = 0.7
WindAmbience = 0.2
ReplaceRain = 1
NatureLifeDensity = 0.5
NatureLifeVolume = 0.3

