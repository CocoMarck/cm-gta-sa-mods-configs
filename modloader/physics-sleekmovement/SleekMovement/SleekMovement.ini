; SleekMovement 1.0 - installed MO2 preset
; 1 = enabled, 0 = disabled
; Ctrl+F11 toggles the menu. SLEEKCFG also opens it in single player.
; Tab/Shift+Tab changes module. Backspace closes it; Enter saves the active tab.

[Features]
EnableLean=1
EnablePitch=1
EnableAimLag=1
; Smooths only native transitions between GUNMOVE_FWD/L/BWD/R while aiming.
EnableAimStrafeBlend=1
; Blend directly from the held aiming pose into the native reload clip.
EnableAimReloadBlend=1
; Adds a subtle secondary neck/head response to movement lean and pitch.
EnableHeadFollow=1
EnableLowerLegCompensation=1
EnableFootIK=1
; User-confirmed preset keeps FootIK active in crouch poses.
EnableFootIKWhileCrouched=1
; Exploration-only on-foot shoulder camera. Firearm aim is entirely vanilla;
; vehicle entry/exit and native camera transitions are yielded. FOV stays native.
EnableModernCamera=1
; Replaces GTA's frame-random positional shake at the shared CCamera stage.
; All native shake producers and every camera mode remain supported.
EnableCameraShakeRewrite=1
; Filters only the two movement-axis reads inside native on-foot processing.
; The global CPad state is never modified.
EnableMomentum=1
; Allows entering and retaining native crouch locomotion from a run/sprint.
EnableCrouchLocomotion=1

[CameraShake]
; Multiplies the rewritten shake displacement. 1.0 matches the current
; rewrite, while 1.25 is the stronger recommended preset. 0 disables motion
; without disabling native shake state or its producers.
Intensity=1.25
; Scales the final spatial displacement independently of native force.
Amplitude=1.1
; Noise frequency in cycles per second. Higher values feel sharper/faster.
Speed=17.0

[Momentum]
; User-approved acceleration/braking and directional-momentum preset.
InputDeadZone=0.08
StopEpsilon=0.015
WalkAcceleration=1.3
RunAcceleration=1.6
SprintAcceleration=1.5
Braking=4.1
ReversalBraking=3.2
ReversalAngleDegrees=115.0
ReversalSwitchSpeed=0.12
LowSpeedTurnRateDegreesPerSecond=540.0
HighSpeedTurnRateDegreesPerSecond=210.0
HighSpeedTurnStart=0.60
LateralGrip=0.72
BlockedSpeedDecay=10.0
TeleportResetDistance=3.0
; The approved preset keeps momentum active while aiming and crouched.
EnableWhileAiming=1
EnableWhileCrouched=1

[CrouchLocomotion]
; Do not let the sprint button immediately cancel an active crouch. Press the
; crouch button again, jump or enter a vehicle to leave crouch normally.
KeepCrouchedWithSprint=1
; With meaningful movement, a new sprint request exits crouch into GTA's
; standing RUN animation. Sprint already held before crouching is ignored until
; released, so entering crouch from a sprint still works.
ExitToRunWithSprint=1
; Keep the outgoing crouch locomotion playing while it fades into standing
; movement. This removes the tiny stop and lets root-motion blending provide a
; natural slower-while-lowering / faster-while-rising speed transition.
PreserveMovementOnExit=1
; Starts GTA's native crouch movement association before the body has reached
; 100% crouch. Lower values overlap running and crouch movement earlier.
MoveStartBlend=0.35
; Positive native animation blend rates. Higher values transition faster.
EnterBlendResponse=4.0
MoveBlendResponse=8.0
; Symmetric outgoing crouch / incoming idle-walk-run crossfade. This changes
; blend weight only; it never changes crouch animation playback speed.
ExitBlendResponse=4.0

[ModernCamera]
; Screen-space composition offsets. X moves left/right: positive = right
; shoulder, negative = left shoulder. Y moves up/down: positive = up,
; negative = down. Neither setting changes camera depth or zoom distance.
OffsetX=0.45
OffsetY=0.15
; Smoothly swaps between left and right shoulder during the modern exploration
; camera. Decimal Windows virtual-key code: 18 = ALT; 0 disables the shortcut.
ShoulderSwapKey=18
; Controller binding: 0=off, 1=L3, 2=R3, 3=D-pad left, 4=D-pad right.
ShoulderSwapControllerButton=3
; Higher values complete the shoulder change faster.
ShoulderSwapResponse=8.0
; The camera follows CJ's animated lower-spine bone. This small offset adjusts
; framing without losing the early vertical motion during climbs and vaults.
AnchorHeightOffset=0.26
; Physical world-space distances for GTA's vanilla zoom indices 1, 2 and 3.
; Pressing V moves the camera between these positions; FOV is never used to
; fake zoom. Lower values move the camera closer to CJ.
ZoomNearDistance=1.50
ZoomMiddleDistance=2.30
ZoomFarDistance=3.40
ZoomResponse=8.0
; Direction-aware body follow. Lateral movement follows quickly. Running
; backwards uses ApproachFollowResponse so CJ cannot catch up to the camera;
; forward movement keeps a little more trailing weight.
LateralFollowResponse=31.5
DepthFollowResponse=6.0
ApproachFollowResponse=14.0
VerticalFollowResponse=14.0
; Independent local-space limits for strafe, movement toward the camera and
; movement away from it.
MaxLateralLag=0.22
MaxApproachLag=0.12
MaxRecedeLag=0.45
MaxVerticalLag=0.35
; Smooth entry/exit when enabling this module.
TransitionResponse=5.5
ExitTransitionResponse=9.0
; Both vehicle handoffs use an ease-in/ease-out curve. Entry starts as soon as
; GTA creates an enter/open-door/carjack task. Exit keeps the v16.10.0 ownership
; boundary and controls only the smooth return after GTA's native exit finishes.
; Higher values complete the respective transition faster.
VehicleEntryTransitionResponse=7.0
VehicleExitTransitionResponse=5.0
; Five collision rays approximate a camera volume. It retracts immediately
; when blocked and returns outward using CollisionRecoveryResponse.
EnableCollision=1
CollisionRadius=0.18
CollisionPadding=0.12
CollisionRecoveryResponse=6.0
NearClip=0.15
; Large position changes reset the delayed anchor instead of sweeping across
; the map after teleporting or leaving an interior.
TeleportResetDistance=8.0

[Lean]
; Maximum whole-body sideways tilt.
MaxLeanDegrees=10.0
; Higher values enter/leave the tilt faster.
LeanInResponse=5.5
LeanOutResponse=5.0
; Relative influence of input, remaining turn angle and angular velocity.
InputContribution=0.30
TurnContribution=0.40
AngularVelocityContribution=1.00
; Error/rate that produces full lean intensity.
FullTurnAngleDegrees=42.0
FullTiltTurnSpeedDegreesPerSecond=120.0

[MovementHeading]
; Direction smoothing while walking/running. This does not affect aiming.
HeadingResponse=6.8
HeadingVelocityResponse=14.0
MaxHeadingSpeedDegreesPerSecond=245.0
MinimumMovementInput=0.05

[Aim]
; Aim-to-reload crossfade duration, in seconds (0.05 to 0.50).
AimReloadBlendSeconds=0.16
; Frame-rate-independent pose-weight response for directional aiming movement.
; 12.5 gives a smooth, responsive crossfade. Higher values transition faster.
AimStrafeBlendResponse=12.5
; Smaller SmoothTime = faster body response. Recommended: 0.04 to 0.14.
AimHeadingSmoothTimeSeconds=0.055
AimMaxHeadingSpeedDegreesPerSecond=720.0
; Vertical body follow. Camera/crosshair remain instantaneous.
AimPitchSmoothTimeSeconds=0.10
AimMaxPitchSpeedDegreesPerSecond=540.0
AimMaxVisualPitchDegrees=16.0
AimPitchInfluence=0.65
; Allows turn lean while aiming without movement input.
AimStationaryLeanFactor=0.70

[UltimateFP]
; Optional integration resolved dynamically from UltimateFP_SA.asi. If the mod
; or either public API export is absent, SleekMovement behaves normally.
EnableIntegration=1
; First-person override for AimHeadingSmoothTimeSeconds. 0.03235 is 70% faster
; than the established third-person value of 0.055 (0.055 / 1.70). Smaller is
; faster. LeanInResponse, LeanOutResponse and lean intensity remain unchanged.
FirstPersonAimHeadingSmoothTimeSeconds=0.03235
; UltimateFP ADS owns the complete first-person weapon pose. Disable every
; MovementLean layer there: heading smoothing, aim lag, lean, pitch and lower-
; leg compensation. Other SleekMovement modules remain independent.
DisableMovementModuleInADS=1

[FootPlant]
; 1.0 fully removes the whole-body tilt from knees/ankles/feet.
; Lower values keep a controlled amount of the original tilt in the legs.
BankCompensation=1.0
PitchCompensation=1.0

[HeadFollow]
; Extra neck/head rotation layered over the rigid body pose. Values are a
; fraction of the movement lean/pitch and do not include firearm aim lag.
LeanInfluence=0.35
PitchInfluence=0.30

[FootIK]
; Continuous per-leg solver. Idle, walking, running and sprinting are supported;
; each animated swing foot releases independently from the planted foot.
ProbeStartHeight=0.50
ProbeDepth=0.70
; Center/toe/heel probes are used normally. Side probes run only when the center
; misses. Fallback needs two agreeing hits; one edge hit cannot plant the foot.
ProbeForwardOffset=0.16
ProbeBackwardOffset=0.13
ProbeSideOffset=0.075
; Upward search remains bounded below the animated knee.
KneeProbeClearance=0.075
SoleOffset=0.025
ActivationDistance=0.50
MaxFootOffset=0.50
; Maximum sideways displacement of the ankle target, in world units. Set 0 to
; keep the animated foot's lateral position completely unchanged.
MaxFootLateralCorrection=0.015
MaxStepUpHeight=0.45
MaxStepDownHeight=0.28
; Compare collision planes at the foot's XY, not raw heights along the ramp.
; Only matching heights and compatible normals are merged.
SurfaceMergeTolerance=0.025
CorrectionDeadZone=0.006
; Contact is inferred from the animated foot's height and root-relative vertical
; speed. Settled contacts have hysteresis; an actual lift releases the latch.
; Larger values keep IK active farther/higher into the swing phase.
ContactHeight=0.11
ContactVelocity=0.75
; Separate weight responses remove the old delayed activation after stopping.
PlantResponse=22.0
ReleaseResponse=16.0
; Contact translation and surface-normal filtering. Actual ground penetration
; bypasses upward position/weight lag within the existing correction limits.
PositionResponse=18.0
NormalResponse=10.0
Influence=1.0
; The analytical two-bone solve uses the animated knee as its pole. Zero bias
; preserves the animation's own knee direction in the confirmed preset.
; MinimumKneePlaneHeight controls pole stabilization, not forced knee bending.
MinimumKneePlaneHeight=0.025
KneeForwardBias=0.0
; Per-joint corrections are clamped instead of disabling the complete IK frame.
; At 35.0 the extra lateral cap is inactive; the ordinary total limit applies.
; Set below MaxHipCorrectionDegrees only if you want to experiment with a cap.
MaxHipLateralCorrectionDegrees=35.0
MaxHipCorrectionDegrees=35.0
MaxKneeCorrectionDegrees=90.0
MaxFootCorrectionDegrees=28.0
; Surface normal Z: 1.0 is flat. IK is disabled below MinimumGroundNormalZ and
; smoothly fades from zero to full strength between these two values.
MinimumGroundNormalZ=0.68
FullInfluenceGroundNormalZ=0.82

[Pitch]
; Forward/backward tilt produced by acceleration and braking.
MovementEnvelopeResponse=3.0
PitchResponse=7.0
MaxAccelerationPitchDegrees=10.0
MaxBrakingPitchDegrees=7.0

[General]
; Ignore visual angles below this threshold.
MinimumVisiblePoseDegrees=0.02
