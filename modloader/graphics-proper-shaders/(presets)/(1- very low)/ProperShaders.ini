[MotionFlow]
Enabled = 1          ; Set 1 to compute per-pixel screen-space motion vectors (optical flow). Needed by SMAA Temporal, TAA and motion blur. Output texture: g_pMotionVectorsTex.
OutputScale = 2      ; Resolution divisor of the final motion vector texture. 1 = full, 2 = half.
                     ; The flow itself is computed at quarter resolution either way, so this does not
                     ; discard measured motion - it only decides how sharply the edge-aware upsample
                     ; resolves motion edges. It is the only full-screen pass here and it writes 8 bytes
                     ; per pixel, so 2 roughly quarters the cost of that pass. Set 1 if you see softer
                     ; edges on moving objects in TAA/SMAA Temporal.
DebugMode = 0        ; Ingame visual test of the motion vectors:
                     ; 0 = off (compute only)
                     ; 1 = flow color wheel (direction = hue, speed = brightness; legend wheel bottom-right)
                     ; 2 = arrow field overlay on the scene
                     ; 3 = reprojection proof: left half = raw frame difference (red), right half = difference after warping previous frame by the motion vectors (green). If MVs work, the right half stays almost black while moving.
                     ; 4 = confidence map (green = trusted, red = occlusion/mismatch)
                     ; 5 = motion magnitude heatmap (blue = slow, red = fast)
DebugGain = 8.0      ; Amplification of the difference image in DebugMode 3
ArrowSpacing = 32    ; Arrow grid cell size in pixels (DebugMode 2)
ArrowScale = 1.0     ; Arrow length multiplier (DebugMode 2)
HeatScale = 32.0     ; Pixels of motion mapped to the strongest color (DebugModes 1, 2, 5)

