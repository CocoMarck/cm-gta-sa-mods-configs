[Base]
EnabledMod = 1           ; Set 0 to completely disable this mod.
LogLevel = 3             ; 1 = Only errors; 2 = Errors and warnings; 3 = All infos;
UseD3D9Proxy = 1         ; Use a D3D9 proxy. This is required for lots of features. Only disable it if you REALLY need it (for compatibility issues).
GenerateDepthBuffer = 1  ; Generates a Z depth buffer. This is required for lots of features. Only disable it if you REALLY need it (for compatibility issues).
ReversedDepthBuffer = 1  ; Reverses the Z depth buffer. This dramatically improves the game's z-fighting problems (nearby faces flickering, especially at a distance). Only disable it if you REALLY need it (for compatibility issues).

; Pipeline is the system behind the game's rendering. Here you can choose which one to use it, or leave it at "0" to not change anything. This is what is needed for the mod's main features, such as shadows that requires "lit".
[Pipelines]
Map = 1       ; 0 = PC unlit; 1 = PS2 PBR
Vehicles = 1  ; 0 = PC unlit; 1 = PS2 lit; 2 = Modern PBR
Skins = 1     ; 0 = PC unlit; 1 = PC lit

; Deferred rendering is a technique widely used in modern games where the game is rendered in an optimized pass to capture the data (buffers), then the final image is built on the screen in one pass. It causes initial overhead, but allows for highly scalable optimization, as well as optimized per-pixel lighting and soft blurred shadows. This drastically changes how the game is rendered. Highly recommended to enable it if you want modern shadows, lights and all PBR features.
[DeferredRenderer]
Enabled = 1               ; Set 1 to enable deferred rendering.
DeferredLights = 1        ; Set 1 to enable per-pixel lighting. The game's original lighting is very basic and outdated; the map doesn't receive it, and skins and vehicles are illuminated by vertices. This option changes how the lighting works, now rendering everything per-pixel on screen pass, like modern games. It is recommended to keep enabled when using deferred rendering.
Intensity = 1.8           ; Lights intensity multiplier.
RadiusMult = 1.5          ; Lights radius multiplier.
MaxLights = 127           ; Max lights to render (up to 127).

[VolumetricLights]
Enabled = 0               ; Set 1 to enable volumetric fog light beams for deferred lights.
MaxLights = 127
Length = 9.0
Radius = 4.0
Intensity = 0.3
Density = 0.5
InnerAngle = 10.0
OuterAngle = 60.0
MinSourceRadius = 6.0
MaxSourceRadius = 35.0
ZOffset = -0.1

[TimecycleTweaks]
DayLightingMult = 1.0       ; Multiplies ambient and sun lighting (basically the world brightness). Lower if you use brighter timecyc (0.5 looks good on Real Linear Graphics mod).
NightLightingMult = 1.0     ; Idem, for night.
SunSizeMult = 0.8           ; Sun size tweak. Note that hundreds of other mods also does this, so if no effect, also find and disable it from other mods you have.

[VehicleTweaks]
ReflectionsIntensity = 0.8
SpecularIntensity = 1.0

[GlobalReflections]
Enabled = 0                 ; Do a sphere map capture of the game world, to use as realtime reflections. Especially useful for "Modern" vehicle pipeline, and also used for PBR reflections on deferred renderer. May cause FPS loss. Some features, like shadows and wind, are not currently executed on reflections, for optimization.
Resolution = 1024           ; Image resolution (power of 2).
CaptureDistanceMult = 10.0   ; Multiplies the max draw distance to capture the reflections.
Intensity = 0.8             ; Global reflections intensity.

[RainPuddles]
Enabled = 1                 ; Wet ground effect. Only available on deferred.
PuddleScale = 0.1
PuddleRipplesScale = 8.0
PuddleBrightness = 0.5

[RainStreaks]
Enabled = 1                 ; Set 1 to enable a custom effect of rain streaks/lines falling. Disable "EnableCustomRainStreaks" on FxsFuncs if you use it.
MaxStreaks = 128
Width = 0.07
Length = 1.0
Intensity = 3.0
DepthSoftness = 2.0

; Texture-driven rain beads and flowing drops on the Modern vehicle pipeline.
; VehicleRainMask.png and VehicleRainNormal.png are loaded from resources/textures/.
[VehicleRainDrops]
Enabled = 1
Intensity = 0.95       ; Visibility and coverage of individual drops.
Scale = 1.05           ; Texture tiling over the bodywork. Higher = smaller drops.
FlowSpeed = 0.22       ; Downward movement speed of drops on side panels.
NormalStrength = 0.66  ; Strength of the rain normal map on the clear coat.
Wetness = 0.62         ; Strength of the wet clear coat/reflection response.

[VolumetricClouds]
Enabled = 0                  ; Set 1 to enable fly-thru volumetric clouds, based on Cloudworks by Brian Tu.
DownscaleDiv = 6             ; Set the resolution downscale division for rendering the clouds: higher numbers make them use lower resolution. The temporal march already costs a quarter of what it used to, so spend that here - 2 looks considerably better than 4 and still costs less than the old non-temporal 4 did. Try 4 if your PC is weak.
Layers = 1                  ; How many clouds layers. This is basically a graphics quality control (highly impacts the performance): 1 = bottom only (low); 2 = bottom + top (medium); 3 = bottom + mid + top (high).
MarchSteps = 128              ; Ceiling on the main ray march, 16 to 200. Original Cloudworks allowed 200 and this port capped it at 64 for Shader Model 3. It only bites when a ray has a lot of cloud to cross, which is what happens once the CAMERA IS INSIDE a layer: the ray starts at zero distance in dense cloud, the adaptive step shrinks to its minimum, and the budget runs out after a few hundred units - the cloud then stops mid-air and the shapes change as you climb. Raise this if you fly through clouds; costs nothing at ground level, where rays rarely run out.
CloudsBrightness_Day = 1.0
CloudsBrightness_Night = 1.0

; --- Temporal amortization ------------------------------------------------
; The clouds are not ray marched in full every frame. The march fills one slot
; of a 2x2 pixel block per frame and the rest of the buffer is reprojected from
; the previous frame using the camera's movement, so it costs a quarter as much
; and every pixel is refreshed every fourth frame. This is always on; spend what
; it saves on DownscaleDiv.
;
; The 2x2 block size is fixed and cannot be widened. A larger block amortizes
; further but cannot be made to look right: a pixel uncovered by moving geometry
; has no history of its own and must wait block^2 frames for a march sample,
; while the nearest sample it could borrow from is block pixels away. Both terms
; get worse together, and 4x4 showed it as outlines around anything that moved.
TemporalBlend = 0.5          ; How much history a just-marched pixel keeps. This is what averages out the ray march's own step jitter, so it IS the temporal half of the denoiser: 0 = snap to each new sample (sharpest, flickers), 0.5 = default, 0.8 = very smooth but slow to react to changing light.
TemporalDenoise = 1.0        ; Spatial half of the denoiser: how fast a pixel that is waiting for its turn leaks towards the smooth upscale of the fresh samples. 0 = off (sharpest, grainiest), 1 = default, 3 = heavy. This is what replaces BlurRadius.
TemporalReject = 1.0         ; How hard history is thrown away where sky is being uncovered by something that moved (a car or a building edge sweeping past). 1 = drop it completely, which is what you want; those pixels fall back to the low-res upscale for a moment and re-sharpen as the march refreshes them. Lower values leave cloud trails around moving objects. 0 = off.
TemporalClamp = 1.0          ; Safety rail only, NOT a filter. The reprojected history is kept inside a generous range around the fresh samples so a diverged pixel cannot stick. Everything the fresh samples know is constant across a whole 2x2 block, so a tight rail here shows up as square blocks - leave at 1.0, raise it to loosen, 0 turns it off.

BlurRadius = 0               ; Extra depth-aware blur over the resolved clouds: 0, 1 or 2. Leave at 0 - TemporalDenoise replaces it and keeps the detail this would smear away. Only worth raising if you want the clouds deliberately soft.



[VolumetricFog]
; Volumetric HEIGHT fog: a real fog bank that pools in valleys and streets, has
; a defined top you can fly over and look down on, internal 3D noise structure,
; volumetric god rays from the shadow map, and light from lamps and headlights
; scattering inside it.
;
; This feature does NOT own the horizon haze. The game's own distance fog keeps
; doing that (see AerialPerspective / ReplaceDistanceFog below), and the screen
; space [SunRays] effect keeps working alongside the volumetric god rays: they
; are two separate elements.
;
; If something looks wrong, DebugView at the bottom isolates each component.
Enabled = 0                  ; Set 1 to enable.
Quality = 2                  ; Raymarch steps: 1 = 9 (low); 2 = 16 (medium); 3 = 24 (high); 4 = 36 (ultra).
DownscaleDiv = 2             ; Resolution divisor for the raymarch. 2 = half res (recommended), 4 = quarter (faster), 1 = full (expensive).

; --- The fog bank ---------------------------------------------------------
Density = 0.015               ; Extinction per meter at and below BaseHeight. THE main knob: how thick the fog is. 0.005 = light haze, 0.02 = clear fog bank, 0.08 = pea soup.
DensityMult = 0.2            ; Global multiplier on top of Density, for presets.
BaseHeight = 10.0            ; World Z of the bottom of the layer (sea level = 0). Density is constant below it, so low ground fills up.
HeightFalloff = 0.02         ; Per meter falloff above BaseHeight. Higher = the layer hugs the ground more tightly.
LayerThickness = 40.0        ; Height above BaseHeight where the ceiling of the bank sits. This is what makes it an ALTITUDE layer instead of fog everywhere.
LayerFade = 18.0             ; Softness of that ceiling. Low = a sharp fog surface, high = a gradual thinning.
LayerSharpness = 0.65        ; How much of the ceiling is applied. 0 = pure exponential falloff (no defined top), 1 = a hard fog bank you can look down onto.
ScatteringAlbedo = 0.8       ; Fraction of extinction that scatters rather than absorbs. Below 1 keeps dense fog from washing out to pure white.
FogStartDistance = 0.0       ; Distance before the fog starts, to keep it off the camera lens.
FogStartFade = 6.0           ; Fade length for that start distance.
MaxDistance = 0              ; Raymarch range in meters. 0 = auto (600). A height layer has nothing to contribute at the far clip, so marching further only wastes steps.
MaxOpacity = 0.8             ; Clamps how much the fog can obscure the scene (0..1).
SkyFogMult = 0.35            ; How much of the layer applies to the sky. Kept low so the fog does not dim the sun disc, which would stop [SunRays] from triggering.

; --- Scattering -----------------------------------------------------------
SunIntensity = 0.05          ; Brightness of sun/moon light scattered by the fog. This is in the same units as the scene, so values near 1 start to blow out.
MoonIntensityMult = 0.3      ; Multiplier for the moon at night.
AmbientIntensity = 1.0       ; Sky light scattered by the fog. This is the classic "fog colour" term.
PhaseG = 0.60                ; Forward scattering lobe (Henyey-Greenstein). Higher = a tighter glow around the sun.
PhaseGBack = 0.25            ; Backward lobe, for the soft glow when looking away from the sun.
PhaseBlend = 0.20            ; Weight of that backward lobe.
PhaseMax = 2.50              ; Caps the forward lobe. Expressed as a gain over isotropic, so 1.0 means no directionality at all.
MaxScatterLuminance = 1.20   ; Hard safety clamp on scattered radiance. This is the backstop against a white-out.
AmbientGroundOcclusion = 0.35 ; How much sky light is occluded deep inside the layer. Gives the bank vertical shading instead of a flat colour.

; --- Volumetric god rays (separate from the screen space [SunRays]) --------
SunShadows = 1               ; Set 1 to sample the shadow map during the raymarch: real shafts cut by geometry. Requires [Shadows] enabled.
GodRayIntensity = 1.0        ; Brightness of the lit shafts. How VISIBLE they are depends mostly on Density, since that is the medium they scatter in.
GodRayShadowCut = 1.0        ; 1 = direct sunlight is exactly zero inside a shadow.
GodRayAmbientCut = 0.70      ; How much sky light the shadow also removes. 1 makes shadowed volumes read as holes punched through the fog.
GodRayDistance = 100.0       ; How far (meters) the fog samples the shadow map. 0 = as far as [Shadows] MaxDistance reaches.

; --- Boosts --------------------------------------------------------------
FoggyWeatherBoost = 3.0      ; Extra density multiplier during foggy weather.
RainWeatherBoost = 1.0       ; Extra density multiplier during rain.
SunHorizonBoost = 2.0        ; Extra density multiplier during sun horizon (sunset/sunrise).
NightBoost = 1.5             ; Extra density multiplier during night.

; --- Light scattering through the fog -------------------------------------
LightsEnabled = 1            ; Set 1 to make deferred point/spot lights (lampposts, headlights) glow through the fog.
LightsIntensity = 1.0        ; Intensity of that glow.
LightsRadiusMult = 1.0       ; Radius multiplier for it.
MaxLightRadius = 80.0        ; Safety limit. GTA's light list also holds special huge lights that would otherwise become screen sized walls.
MaxLights = 12               ; Max lights influencing the fog per frame (hard limit 12: each costs 3 shader constant registers).

; --- Light diffusion ------------------------------------------------------
; The scene masked by fog opacity, blurred through a mip pyramid and added back,
; so bright surfaces bleed light into the medium around them.
LightDiffusion = 1           ; Set 1 to enable.
DiffusionIntensity = 0.5     ; How much bled light is added back.
DiffusionUpsample = 0.4      ; Weight of each coarser pyramid level. Higher = a wider, softer bleed.
DiffusionLevels = 3          ; Pyramid levels. More = light spreads further, at the cost of a pass each.

; --- Misc -----------------------------------------------------------------
BlurRadius = 1               ; Depth aware denoise of the raymarch result: 0 = off, 1 = recommended, 2 = softer.
FogWaterPlane = 1            ; Set 1 to make the water surface the FLOOR of the fog: there is no air below it, so rays heading down stop at the surface and nothing under the sea gets fogged.
SeaLevel = 0.0               ; World Z of the sea surface, used by FogWaterPlane from land. The level under the camera is used instead whenever the game reports one.
DebugView = 0                ; 0 = normal; 1 = in-scattered light only; 2 = fog amount as greyscale; 3 = the diffusion pyramid.

[Shadows]
Enabled = 1                     ; Set 1 to enable per-pixel dynamic shadows. Requires pipelines, and deferred renderer is highly recommended for performance and blurred shadows.
BlurSamples = 7                 ; Gaussian blur samples to blur the shadows (requires DeferredRenderer). More (up to 12) looks smoother, costing a bit of performance.
Resolution = 4096               ; Shadow resolution (power of 2). 4096 is generally a good number, but you can try 8192 if your GPU is powerful or for "photo mode". If cascade is enabled, this is the atlas resolution (each cascade will use half).
PCSS = 0                        ; Use NVIDIA's PCSS (Percentage-Closer Soft Shadows) algorithm. Slightly more resource-intensive, but it makes the shadows a bit more realistic (the base will be sharper, softer in distant projections).
Cascaded = 0                    ; Use 4 cascades of shadows for high-resolution close-up shadows, with lower-resolution shadows at a distance. This significantly increases CPU and GPU usage, specially on this engine, therefore, don't enable it on weak or even mid-range PCs.
MaxDistance = 200               ; Shadows range distance in meters. More distant shadows consume more resources, and the quality is compromised, requiring an increase in resolution to avoid pixelated shadows. Generally, 200 or 300 are good numbers.
MaxDistanceNightMult = 0.0      ; Multiplier for "MaxDistance" during night time. Set 0.0 to disable night shadows (useful for a FPS boost, for using deferred and volumetric lights without lagging the game at night).
SearchObjectsRadiusMult = 0.8   ; Distance multiplier for including objects in shadow capture. This is an important fine-tuning adjustment for performance. Increasing it (e.g. 1.2) prevents shadow pops, while lowering it (e.g. 0.8) can improve performance but may cause shadow pops.
SearchObjectsFrustumMult = 0.8  ; Idem above. For frustum culling width/height.
SearchObjectsFarPlaneMult = 0.8 ; Idem above. For frustum culling range distance.
Softness = 1.0                  ; Multiplier to create softer or sharper shadows.
NormalBiasMult = -2.0           ; Multiply the bias (offset) to avoid shadow acne on walls etc. This value should be as low as possible to avoid light leaking, specially near the roofs, but high enough to avoid incorrect shadows on angles. This option uses the mesh normals, which are quite poor in the vanilla game (Proper Fixes will improve this), so don't use high values.
DepthBiasMult = 1.0             ; Same as before, but a simple depth offset.
SlopeBiasMult = 10.0            ; Same as before, but for slope walls projection from the light.
;- Shadows capture exclusions
CastStaticObjects = 1           ; Set 0 to disable shadows from static objects (such as buildings). It doesn't make much sense, but here's the option.
CastDynamicObjects = 1          ; Set 0 to disable shadows from dynamic objects (such as lampposts). Disabling is useful to improve performance for low-end PCs. See also "CullFarSmallObjects".
CastVehicles = 1                ; Set 0 to disable shadows from vehicles. It significantly improves performance, especially in non-optimized HD vehicles. In the future may have an option to use the internal vehicle shadow mesh instead.
CastVehiclesLOD = 1             ; Set 0 to disable shadows from LOD vehicles (distant). It doesn't improve performance that much because the LODs are very optimized.
CastPeds = 1                    ; Set 0 to disable shadows from skinned models (player, peds).
CastLODs = 1                    ; Set 0 to disable shadows from LOD objects (distant). Generally is not a good idea.
CullFarSmallObjects = 1         ; Set 1 to not render shadows for small objects that are far away from the camera. It improves performance with almost no noticeable visual change.
;- Vanilla shadows
NoPedLowShadows = 1        ; Set 1 to disable low graphics shadows from peds.
NoVehicleLowShadows = 0    ; Set 1 to disable low graphics shadows from vehicles.

[SMAA]
Enabled = 1            ; Set 1 to enable Subpixel Morphological Antialiasing, an excellent anti-aliasing algorithm to replace MSAA, because, for technical reasons, MSAA (the original game AA) is not compatible with this mod, and MSAA is also more resource-intensive and causes artifacts in high-poly models, such as HD cars.
DebugMode = 0
EdgeDetectionType = 1
Preset = 2             ; 0 = Low; ... 3 = Ultra
Temporal = 1           ; SMAA T2x reprojected by [MotionFlow]. Improves anti-aliasing but jitters and blurs the image a bit. Good for screenshots.

[CAS]
Enabled = 0            ; Set 1 to enable AMD Contrast Adaptive Sharpening.
Sharpness = 0.25       ; 0.0 to 1.0

[SimulateHDR]
Enabled = 1                    ; Set 1 to enable an excellent postFX shader that simulates HDR color rendering, and applies tone mapping to it, so the game's colors are more realistic, resembling those of modern games. It also applies realistic bloom and other fine adjustments to color, contrast etc.
DebugMode = 0
;- Tonemap
Tonemap = 1                     ; Tonemap to use: 0 = Timoty; 1 = ACES
ColorBrightnessExtract = 0.5
MiddleGreyValue = 0.256
WhitePoint = 1.1
HDR_Power_Day = 0.4
HDR_Power_Night = 0.6
;- Eye adaptation
EyeAdaptation = 0
EyeAdaptation_Speed = 0.2
EyeAdaptation_SeekRadius = 0.5
;- Adjustments
Exposure_Day = 2.0              ; Basically the screen brightness (for day). Can be negative.. See also "DayLightingMult".
Exposure_Night = 0.0            ; Idem (for night)
Contrast_Day = 1.0
Contrast_Night = 1.05
Gamma = 1.4
Saturation = 1.3
;- Bloom
Bloom_Intensity_Day = 0.2
Bloom_Intensity_Night = 0.7
Bloom_Power = 0.5
Bloom_Curve = 2.0
Bloom_Spread = 1.5
Bloom_Dither = 0.125
Bloom_Saturation = 0.5
Bloom_Cutoff = 0.25

[LUTS]
Enabled = 0                      ; Set 1 to enable global color grading LUT (Look-Up Table) textures. Requires SimulateHDR. You can download LUTs or create using image editing softwares, like Photoshop.
LutDay = LUT_DAY.png             ; Texture for daytime (loaded from resources/textures/).
LutNight = LUT_NIGHT.png         ; Texture for nighttime (loaded from resources/textures/).

[AdaptiveDOF]
Enabled = 0                      ; Set 1 to enable adaptive depth of field. Good for gameplay, but great for screenshots / photo mode.
Intensity = 0.9                  ; Final DOF blend strength
MaxBlurPx = 2.5                  ; Maximum blur radius in pixels
FocusRange = 16.0                ; In-focus band around current adaptive focus distance
FocusDistanceBias = 0.0          ; Adds/subtracts distance from adaptive focus
NearBlurBoost = 0.0              ; Extra blur multiplier for near side (foreground)
FarBlurBoost = 1.0               ; Extra blur multiplier for far side (background)
MaxDepthToConsider = 220.0       ; Clamps sampled linear depth before CoC calculation
DepthPowerFactor = 1.0           ; Optional depth curve shaping
MaxDepthBlendLevel = 1.0         ; 0 = no clamp blend, 1 = full clamp blend
OverriddenFocusDistance = 0.0    ; Manual focus distance (linear world units)
OverriddenFocusDistanceBlendLevel = 0.0   ; 0 = full adaptive focus, 1 = full overridden focus
FocusScreenX = 0.50              ; Focus probe X on screen (0..1)
FocusScreenY = 0.40              ; Focus probe Y on screen (0..1)
FocusSampleRadiusPx = 20.0       ; Radius around probe to estimate adaptive focus
BlurNear = 0                     ; 1 = allow foreground blur (usually blurs player too much)
BlurFar = 1                      ; 1 = allow background blur

[SSAO]
Enabled = 0            ; Set 1 to enable Screen Space Ambient Occlusion (add shading to corners, crevices etc) - deprecated.
Sharpness = 0.3
BlurSteps = 9
LumLower = 0.3
LumUpper = 0.6
FadeStart = 0.6
FadeEnd = 0.9
BaseBias = 0.004
NormalBias = 0.002
Samples = 16
SamplingRange = 30.0
Darkening = 1.7
Brightening = 1.0
DebugMode = 0

[HBAO]
Enabled=0            ; Set 1 to enable Horizon-Based Ambient Occlusion (add shading to corners, crevices etc)
DebugMode=0
Samples=1
SamplingRange=4.0
Amount=5.0
Amount_InteriorMult=0.5
Clamp=0.1
Attenuation=0.02
Sharpness=0.7
BlurSteps=7
TexScale=1.0
FadeStart=0.7
FadeEnd=0.9

[SSGI]
; Screen-space GI built on a visibility mask (SSILVB). The hemisphere is cut
; into angular sectors; a sample only lights the sectors it newly covers, and
; sectors nothing ever covered are filled from a world-space probe.
Enabled = 0
TraceResolution = 4            ; Trace divisor. 4 = quarter resolution, 2 = half, 1 = full.
Slices = 3                     ; Hemisphere slices per frame (1..8). Rotated every frame; history converges them.
StepsPerSlice = 6              ; Samples per slice side (4..32). Quadratic spacing over the mip pyramid.

; --- Reach -------------------------------------------------------------------
; Radius is in WORLD UNITS, not screen space. Geometry further than this from a
; shading point neither lights it nor occludes it, which is what stops a tree
; from bleeding its colour onto a building forty metres behind it. Raise it for
; broader, softer bounce; lower it for a tighter, contact-shadow look.
Radius = 5.0
MaxRadiusScreenFraction = 0.5 ; Ceiling on the projected radius, as a fraction of the trace height. Bounds cost up close.
Thickness = 0.5                ; World-unit depth assumed behind a surface, so light can pass behind thin geometry.
                               ; ALSO the main AO strength control. Each sample only marks the arc between its front
                               ; and back face, so with few steps this is what decides how much of the hemisphere gets
                               ; marked at all: at 0.2 a sample 5 units away covers 0.2 of one sector out of 16, and
                               ; eight of them reach ~10% occlusion, which AOWhitePoint then erases entirely. 0.6-1.0
                               ; gives real occlusion. Too high leaks shadow behind thin geometry.
LinearThickness = 1            ; Scale Thickness with distance, so far-away geometry is not treated as paper thin.
MipOptimization = 1            ; Climb the mip pyramid as the ray lengthens. Off = sharper, noticeably slower.

; --- Look --------------------------------------------------------------------
Intensity = 10.0               ; Indirect bounce intensity. 1.0 is the energy-conserving value.
Saturation = 1.1               ; 0 = monochrome bounce, >1 = exaggerated colour bleeding.
MaxIndirectLuminance = 0.02    ; Soft ceiling on the bounce, in expanded-linear units.
BackfaceLighting = 0.0         ; 0 = an emitter facing away contributes nothing. Raising it softens GI terminators but can leak through thin walls.
SkinIsEmitter = 0              ; Characters always receive GI. Letting them emit paints a halo behind their silhouette.
FadeoutDistance = 400.0        ; World units. The receiver fades out with exp(-z/this).
HdrHeadroom = 1.10             ; White point (>1) the inverse tonemap expands the composite to. Higher = punchier bounce.

; --- Ambient occlusion (optional) --------------------------------------------
; Produced by the same visibility mask as the bounce, so it costs nothing extra.
; Turn it off if you already run [HBAO] or [SSAO]; do not stack them.
AOEnabled = 1
AOIntensity = 1.0              ; 0 = never darken (bounce only), 1 = full occlusion.
AOPower = 10.0                 ; Contrast of the occlusion curve. >1 darkens creases harder. Applied AFTER the temporal
                               ; filter and both denoiser passes, so a steep value no longer amplifies frame-to-frame
                               ; noise the way it did when the trace applied it. Note it can do NOTHING if AOWhitePoint
                               ; has already snapped visibility to exactly 1 - pow(1, anything) is 1. If raising this
                               ; changes nothing, the problem is Thickness or AOWhitePoint, not this.
AOAngleBias = 25.0
AOWhitePoint = 0.95            ; Visibility at or above this snaps to pure white, killing the light-grey shimmer on open
                               ; walls. 1.0 disables it. LOWER = MORE surfaces forced white = LESS AO: at 0.85 anything
                               ; under 15% occlusion is erased outright, which with a low Thickness is most of the scene.

EnableEmissiveGI = 1
EmissiveThreshold = 1.50       ; In expanded-linear luminance, not display luminance.
EmissiveStrength = 1.0
EnableMultiBounce = 0          ; Feeds the previous frame's irradiance back in as a second bounce.
MultiBounceStrength = 0.35
FireflyMaxLuminance = 30.0     ; Soft ceiling on a single emitter. Well above scene white (~10) on purpose: it should catch outliers, not dim every bright wall.

; --- Temporal ----------------------------------------------------------------
TemporalEnabled = 1            ; Uses [MotionFlow]: previousUV = currentUV - motion.xy.
TemporalHistoryWeight = 0.98   ; The slice set rotates every frame, so history is what converges the gather.
TemporalDepthThreshold = 0.03   ; Relative depth error that fully rejects reprojected history.
; Bounds reprojected history by this frame's neighbourhood, which is what stops
; ghosting. Both values are in STANDARD DEVIATIONS of slack around the
; neighbourhood mean: ~1 is tight (least ghosting, most noise), ~4 is loose.
; NOTE: these used to be a fraction of the neighbourhood's min/max range. That
; cannot bound anything at a low slice count - neighbouring pixels resolve
; different hemisphere slices, so one sees an occluder and the next does not, the
; extremes land at opposite ends of the range, and a box spanning the whole range
; permits every value there is. Old values do not carry over; retune from these.
TemporalClampStrength = 1.0    ; For the indirect bounce.
TemporalClampStrengthAO = 0.7  ; For AO/visibility. Normally tighter: AO darkens correctly lit pixels directly, while a
                               ; ghosted bounce arrives multiplied by this frame's albedo and hides much better.
                               ; Lower this first if AO smears behind moving objects.
TemporalFlowTrustFloor = 0.9   ; History kept when MotionFlow has no confidence but the depth test still validates the pixel.
                               ; MotionFlow reads low on big untextured walls, which is where a halved history shows most.
                               ; Raise toward 1.0 if broad areas still pulse while the camera turns; lower if that ghosts.

; Two a-trous passes, both a fixed 3x3 stencil. Reach comes from the spacing,
; not from the tap count: that is what a-trous is for, and a runtime radius costs
; a nested dynamic loop on every tap of every pixel.
DenoiserEnabled = 1
DenoiserWideSpacing = 3.0      ; Tap spacing of the first a-trous pass, in trace-resolution pixels. Raise to blur wider for the same cost.
DenoiserDepthSigma = 10.0      ; Higher = stricter depth edge stopping.
DenoiserNormalSigma = 8.0      ; Exponent of the normal edge-stopping term.
DenoiserLumaSigma = 0.5        ; Higher = preserves more contact detail, keeps more noise.
UpscaleDepthAware = 1          ; Bilateral 4-tap upscale from trace to screen resolution.

DebugMode = 0                  ; 0 final, 1 indirect x albedo, 2 raw indirect, 3 visibility/AO, 4 depth,
                               ; 5 view normals, 6 motion vectors, 7 radiance pyramid,
                               ; 8 temporal frame count, 9 albedo, 10 expanded scene,
                               ; 11 emissive mask, 12 projected gather radius, 13 distance fade.

[SunRays]
Enabled = 1               ; Set 1 to enable a kind of lensflare/godray in the sun, which is dynamically occluded by the camera contents.
quality = 1
godraysDensity = 0.95
godraysWeight = 0.65
godraysDecay = 0.92
godraysThreshold = 0.75
haloEnabled = 1.0
