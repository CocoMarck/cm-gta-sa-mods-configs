ForcedLifetimeMs=0
MaxActive=32
VelocityScale=2.0
UpwardBoost=0.05
ShowHud=1
; Write ProperRagdoll.log (0 = no log file at all).
Log=0
; Detailed log.
VerboseLog=1
PoseLogIntervalMs=500

; Deve ficar 0 (caminho JSON legado desativado).
SAProfileShapesOnly=0
SelfCollision=1

; ── Fisica base ─────────────────────────────────────────────────────────
; O "peso" agora vem do atrito articular + musculos que relaxam na morte,
; entao o amortecimento angular pode ser menor (membros balancam natural).
LinearDamping=0.12
AngularDamping=0.9
Friction=0.9
Restitution=0.03
; Atrito/quique do corpo caido no CHAO (paredes ficam com o atrito baixo).
; Antes ~0.5 combinado: quem pulava do carro deslizava como treno.
; Nao vale para quem esta de pe (puppet) - os pes ficam como antes.
GroundFriction=1.0
GroundBounce=0.12
; Nivel da agua (Proper Shaders: mar com ondas + piscinas; senao o do jogo).
Buoyancy=1
; Ao tocar a agua o ragdoll acaba e o jogo assume: morto -> anim de
; afogamento, vivo -> nada/afoga (mod de natacao). Nenhum ragdoll e criado
; para quem ja esta na agua. 0 = corpos boiam (buoyancy) em vez disso.
WaterEndsRagdoll=1
; Morrer pegando fogo: se debate e rola num sentido (Euphoria onFire).
OnFireWrithe=1
; Gravidade so dos ragdolls (o VC usa 20 m/s2, o dobro da real: corpos caiam
; rapido demais, sem "peso"). 0.7 = 14 m/s2.
GravityFactor=0.7

; ── Construcao do corpo (RagdollBuilder) ────────────────────────────────
; Juntas anatomicas: joelho/cotovelo ate 150 graus, quadril flexiona 130
; (antes 90/45 -> policial agachado virava estatua ajoelhada).
AnatomicalJoints=1
; Caixa do pe + capsula da mao (antes pe e mao nao tinham colisao e
; afundavam 12-17 cm no chao).
ExtremityShapes=1
; Caixas do torso no peito/barriga (antes centradas na coluna, nas costas).
AnatomicalTorso=1
; Raio da cabeca (SA usava 0.20 = cabeca de 40 cm).
HeadRadius=0.115
; Escala de todas as amplitudes articulares (1.0 = medido nas animacoes).
JointLimitScale=1.0
; Velocidade herdada da animacao por membro (seed). O SA tinha o sinal
; invertido; 1.0 = derivada real.
LimbVelocityScale=1.0

; ── Runtime ─────────────────────────────────────────────────────────────
; Atrito articular de cadaver (multiplicador). Maior = corpo mais "pesado".
JointFrictionScale=1.0
; Forca muscular global dos comportamentos ativos.
MuscleScale=1.0
; Vivo caindo: bracos amortecem a queda, protege a cabeca rolando,
; braços/pernas se debatem em quedas altas.
ProtectiveBehaviors=1
; Resgata membro que atravessou a malha do chao (Jolt ignora backfaces).
FallThroughRescue=1
; Ergue o corpo no spawn se algum membro nasceu abaixo do chao.
SpawnDepenetration=1
; Meio-tamanho do "colchao" de seguranca sob a pelve (m).
FloorPadHalfExtent=0.60
; Carros movidos por velocidade (CCD) em vez de teleporte (antes as pernas
; ficavam dentro do capo a 50+ km/h).
VehicleKinematicMove=1
; Equilibrio de pe (puppet): o peso do corpo so e sustentado pelos PES no
; chao, com o centro de massa sobre eles; os passos vao para onde o corpo
; realmente esta indo. 0 = como no FIX25g (corpo "segurado no ar").
GroundedBalance=1

; ── Morte ───────────────────────────────────────────────────────────────
; Musculos seguram a pose da morte e soltam (pernas primeiro): o corpo
; desaba em vez de cair duro feito tabua.
DeathMuscleTone=0.55
DeathRelaxMs=900
; Impulso do tiro na parte atingida (N*s), afasta do atirador.
ShotImpulse=28.0
ShotImpulseHeavy=55.0
; Lancamento extra do corpo inteiro em mortes por Python/escopeta (m/s).
PythonDeathImpulse=2.0
ShotgunDeathImpulse=3.0
FirearmDeathUpImpulse=0.3
SAMoveSpeedScale=50.0
StationaryToppleAngularSpeed=0.65

; ── Veiculos ────────────────────────────────────────────────────────────
VehicleProxies=1
VehicleProxyRadius=22.0
VehicleProxyMax=32
VehicleProxyPadding=0.02
VehicleVelocityScale=50.0
; So usado se VehicleKinematicMove=0 (modo teleporte antigo).
VehicleContactVelocityFactor=0.75
VehicleRideAlongFactor=0.55
; Abaixo desta velocidade relativa (m/s) um NPC vivo so cambaleia ao ser
; esbarrado por um carro (GTA IV); acima, ragdoll completo.
VehicleStaggerMaxSpeed=4.5
; Musculos "atordoados" apos carro/explosao (corpo dobra sobre o capo).
ImpactStunStrength=0.45
; Atropelamentos abaixo desta velocidade (m/s) viram queda sobrevivivel.
SurvivableHitMaxSpeed=9.0

; ── Player ──────────────────────────────────────────────────────────────
PlayerRagdoll=1
; Carros a menos de 3.5 m/s nao derrubam o player (transito empurrando).
PlayerVehicleMinSpeed=3.5
; Queda que derruba o player (~15 m/s, ~5.6 m de altura).
PlayerFallRagdollMinSpeed=0.30
PlayerRecoveryMinMs=450
PlayerRecoveryMaxMs=3200
; Pular ou correr levanta assim que o corpo quase parou.
PlayerQuickGetUp=1
; Igual ao GTA V: pulando ou caindo, apertar R larga o player em ragdoll.
; AirRagdoll = 0 desliga a funcao inteira (teclado e controle).
; AirRagdollKey = codigo da tecla (82 = R, 0 = desliga).
; AirRagdollPad = 1: no controle e o R3 (botao de olhar pra tras).
AirRagdoll=1
AirRagdollKey=82
AirRagdollPad=1
; Arma do NPC morto cai da mao com fisica e fica no chao onde parou (sem o
; pickup girando); passar por cima pega, com a municao do jogo.
; 0 = pickups normais do jogo e nada disso roda.
WeaponDropPhysics=0
; Desmembramento: o tiro que mata arranca cabeca, braco ou perna (escopeta e
; magnum de perto, sniper, explosao, armas brancas). O pedaco voa com fisica
; e o toco sangra. 0 = desligado e nada disso roda.
Dismemberment=0
; Com o desmembramento ligado: 1 = explosoes tambem arrancam partes, 0 = nao.
DismembermentExplosions=1
; III / VC: 1 = pedacos desenhados em modo simples (sem o sombreamento de mods de
; shader); use so se os pedacos nao aparecerem com 0.
DismembermentImmediateDraw=0
PlayerMuscle=1.15
PlayerVehicleHitRagdoll=1
ExplosionRagdollPlayer=1

; ── Recuperacao (vivos) ─────────────────────────────────────────────────
RecoveryEnabled=1
RecoveryMinMs=700
RecoveryMaxMs=6000
RecoverySettleMs=240
RecoverySettleLinear=1.1
RecoverySettleAngular=2.2
BlendInMs=120
; FIX18: inercializacao (a anim de levantar toca 100% desde o 1o quadro e
; so a diferenca fisica->anim decai ate zero neste tempo).
BlendOutMs=450

; ── Gatilhos extras ─────────────────────────────────────────────────────
FallRagdoll=1
FallRagdollMinSpeed=0.26
; Landing speed that kills (0.56 = about a 40 m drop; 0 = the game's fall damage only).
FallDeathSpeed=0.56
; A ragdoll hitting the ground, a wall or a car makes an impact sound.
ImpactSounds=1
; Impact sounds from the .wav files in ragdoll_audio (needs CLEO; 0 = the game's punch sounds).
ImpactWavs=1
; Loudness of the ragdoll_audio sounds (the game's SFX volume applies on top).
ImpactWavVolume=0.05
ExplosionRagdoll=1
LaunchRagdoll=1
LaunchRagdollMinSpeed=0.30
PlayerPushesRagdolls=1
LegShotRagdoll=1
MeleeKnockdownRagdoll=1
FallStabilization=1

; ── Equilibrio ativo (cambaleio GTA IV) ─────────────────────────────────
; O ped da passos para recuperar o equilibrio (capture point). Tiro na
; perna faz mancar e evitar apoiar nela; tiro no braco derruba o braco.
; FIX18: DESLIGADO. Ragdoll inteiro sustentado por forcas = boneco de Olinda.
; Golpes leves agora: animacao do jogo + tranco fisico (PhysicalHitReactions).
ActiveBalance=0
; Tranco fisico no tronco/cabeca/braco atingido por cima da animacao
; (pes continuam plantados). HitFlinchScale = intensidade (0 desliga).
PhysicalHitReactions=1
HitFlinchScale=1.0
; Soco + continuar andando contra o NPC (dentro desta janela, ms) = ele
; tropeca para tras e cai. Correr contra qualquer NPC acima desta velocidade
; do player (m/s) tambem derruba.
PushKnockdownAfterHitMs=2500
PushKnockdownSpeed=4.8

; ── FIX19: active ragdoll estilo PuppetMaster (Unity) ──────────────────────
; O corpo fisico fica "pinado" na animacao do jogo (o ped continua andando,
; correndo, brigando normalmente) e cada colisao/golpe drena o pin da parte
; atingida. Se alguma parte de sustentacao se afasta demais da animacao, ele
; perde o equilibrio e cai de verdade; senao recupera sozinho.
; Tiro / soco em NPC vivo vira puppet (tiro na perna correndo = tropeca e cai).
PuppetHits=1
; Carro encostando devagar (abaixo de VehicleStaggerMaxSpeed m/s): o jogo nao
; derruba/mata mais o NPC; o carro empurra o corpo e a fisica decide.
PuppetCarPush=1
; Levantar: a anim de levantar toca desde o 1o quadro e os pins puxam o corpo
; deitado ate ela (respeitando o chao: nao afunda).
PuppetGetUp=1
GetUpPinRampMs=600
; Quanto o pin volta por segundo (maior = recupera o equilibrio mais rapido).
PuppetRegainPinSpeed=0.9
; Resistencia a colisao (maior = mais dificil derrubar).
PuppetCollisionResistance=1.0
; Multiplicador da distancia de perda de equilibrio (maior = mais firme).
PuppetKnockOutScale=1.0
PuppetMinMs=500
PuppetMaxMs=5000
BalanceOnShots=1
BalanceShotChance=60
StaggerPlayer=0
StaggerMissionPeds=0
MeleeStaggerChance=60
MeleeBehindBonus=35
PushStagger=1
PushStaggerMs=250
BalanceStepping=1
BalanceMaxSteps=4
; Tempo minimo de cambaleio antes de recuperar em pe.
StaggerMinMs=900
BalanceMaxMs=2600
BalanceMotorStrength=1.0
BalanceTiltFallDeg=55.0
BalanceComOffsetFall=0.30
BalancePelvisDropFall=0.45
HitImpulseScale=1.0

; ── Arrasto pela porta (GTA IV) ─────────────────────────────────────────
; Motorista arrancado do carro as vezes se agarra a porta e e arrastado
; quando o ladrao sai acelerando.
DoorDrag=1
DoorDragChance=45
DoorDragMinSpeed=2.5
DoorDragMinMs=900
DoorDragMaxMs=2600

; ── FIX16: reacoes estilo Euphoria (GTA IV) ─────────────────────────────
; Balas acertam o proprio ragdoll: cada tiro empurra a parte atingida de
; um corpo caido / cambaleando / no chao, e o jogo recebe o acerto normal
; (dano, sangue). Impulsos em N*s por bala.
BulletHitsRagdolls=1
BulletImpulse=16
BulletImpulseHeavy=30
PelletImpulse=7
; Atropelamento: chance de sobreviver cai de 100% em CarHitSafeSpeed ate 0%
; em CarHitLethalSpeed (m/s; 7 = 25 km/h, 22 = 80 km/h). Passar com as rodas
; por cima multiplica a chance por RunOverSurvivalScale. 0 = letal vanilla.
CarHitSurvival=1
CarHitSafeSpeed=7
CarHitLethalSpeed=22
RunOverSurvivalScale=0.5
; Feridos (atropelados, explosao, baleados) se contorcem no chao com a mao
; no ferimento antes de levantar.
WritheChance=65
WritheMinMs=1600
WritheMaxMs=4200
; Tiro fatal num ped em pe: cambaleia, leva a mao ao ferimento e as pernas
; cedem (em vez de cair feito saco). Nao vale para tiro na cabeca.
DyingStaggerChance=0
DyingStaggerMinMs=450
DyingStaggerMaxMs=1250
; FIX22: o tiro fatal roda no puppet (passos, mao na ferida, joelhos cedem).
; DyingStaggerChance continua valendo como chance. 0 = volta ao antigo.
DyingPuppet=1
DyingPuppetMinMs=700
DyingPuppetMaxMs=1600
; FIX22: corpo arremessado que atinge um ped em pe vira puppet (cambaleia/cai).
RagdollDomino=1
; Quanto da animacao de morte vanilla aparece antes do ragdoll (ms, max).
; So vale com DeathAnimation=0.
DeathRagdollDelayMaxMs=0
; Animacao de morte com forca muscular: a animacao de morte do jogo toca e o
; corpo fisico a segue com pinos + musculos (estilo PuppetMaster/Euphoria),
; entao parede, carro e outro corpo ja o param fisicamente. Ate
; DeathAnimCheckFrom (fracao, 0.33 = 1/3) a forca e total; dai ate
; DeathAnimRelease (0.90 = 90%) pinos e musculos vao enfraquecendo (o blend da
; animacao para o ragdoll). Encostar em parede/carro/corpo depois de 1/3, ou
; ser bloqueado longe da animacao, solta os musculos na hora; senao soltam em
; DeathAnimRelease (pernas primeiro). Atropelamento, explosao, queda,
; escopeta/magnum, fogo e o cambaleio do tiro (DyingPuppet) continuam com
; ragdoll na hora.
; DeathAnimMaxMs: limite de seguranca. DeathAnimation=0 volta ao antigo
; (DeathRagdollDelayMaxMs).
DeathAnimation=0
DeathAnimCheckFrom=0.33
DeathAnimRelease=0.90
DeathAnimMaxMs=4000

