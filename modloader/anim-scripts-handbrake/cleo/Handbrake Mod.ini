# Handbrake Mod by Junior_Djjr - MixMods.com.br
[Settings]
Volume = 0.5        # 0.0 ~ 1.0
AnimSpeed = 10.0    # 4.0 = Normal, 10.0 = Fast
AlwaysSecAnim = 1   # EN: if some mod is thinking that you left the car when holding the handbrake, enable this. If anim is failing, disable | PT: se algum mod está pensando que você saiu do carro quando está segurando o freio de mão, ative isto. Se a anim está falhando, desative
MinXsize = 0.9      # EN: min model side size, to not apply on Mower, Kart etc | PT: tamanho mínimo lateral do modelo, para não aplicar no Mower, Kart etc