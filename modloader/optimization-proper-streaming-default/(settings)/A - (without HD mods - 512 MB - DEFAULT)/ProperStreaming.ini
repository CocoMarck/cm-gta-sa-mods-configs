[Streaming]
; General settings and preloading for the game's streaming. You can hold SHIFT while the game starts to skip them.

; Forces this streaming memory limit (the memory used to keep loaded files in RAM, like vehicles, scenery etc).
; In MB; the default is 50. The game supports up to 2048 (2 GB). Don't use 2048 (or close to it) without "Largeaddress" installed (included in the Essentials Pack).
; In short, set this to the minimum you need, with some headroom. You need more if you use HD texture mods etc. Recommended: at least 512, 1024 for a game with some mods, and 2048 for a game with HD textures (like RoSA Evolved).
; You can check the usage with some mods, like the F5 key of Open Limit Adjuster. It's normal for the game to reach the limit after a few minutes of normal gameplay; from then on the game unloads unused things to make room for loading new ones.
; It's exactly the same thing MixSets and other mods do. The value here replaces the same value set in other mods.
StreamMemoryForced=512

; Preloads all LODs (low detail objects seen from far away).
; This fixes holes in the map caused by the delay in loading the models.
PreLoadLODs=1

; LODs with this size or bigger in the IMG are not preloaded (in KB).
PreLoadSkipCDSize=25

; Bytes of streaming memory that count as "a lot of memory" for one LOD (ShowPreLoadDebugLog >= 1)
PreLoadLogHighDiffMemoryAfterLoad=50000

; Preloads all animation files (IFP)
PreLoadAnims=0

; If the streaming memory usage goes over this percentage, the mod starts gradually unloading unused models to free memory.
; Originally the game only unloads when it reaches the limit (which increases the streaming workload, causing delays and stutters); this feature keeps the limit from being reached. The same is also done when "MaxRAM" is reached.
RemoveUnusedWhenPercent=95

; Delay to unload each no longer used model when "RemoveUnusedWhenPercent" is reached.
; If the memory usage is close to the limit, the mod automatically cuts the delay in half.
; You can use "0" to unload every frame, but that can also increase the streaming workload.
RemoveUnusedInterval=120

; The game will force freeing RAM by unloading unused models if the game process RAM usage goes above this value.
; The game usually has problems when RAM usage is close to or above 3.5 GB. To be safe, a value like "3100" (3.1 GB) is stable, but if you have problems, like the map stopping loading and pause menu textures disappearing, lower it even more.
MaxRAM=3100

; 1 = Lists in the .log file all models being loaded. It will slow down the game loading. Use it if you think some model is causing a crash when loading.
; 0 = Small .log file with little information (like warnings). 1 = LODs above the memory limit, 2 = includes the skipped ones, 3 = all. Use -1 to disable the .log.
ShowPreLoadDebugLog=0
; Shows the game RAM usage on screen (replaces subtitles; for testing only).
ShowRAM=0


[TexBridge]

; Enable (1) so all textures loaded from .txd are stored in a ProperStreaming64.exe server (64-bit), so they don't use up the 32-bit limit of the game executable.
Enabled=1

; 0 = installs only the device hooks and lets RenderWare load the textures by itself (A/B test).
BridgeTextures=1

; Shared memory window used to pass each texture (MB, 4-256).
; Textures bigger than this are passed in pieces. Takes this much address space of the game executable, so don't overdo it.
IpcBufferMB=32

; Enable so ProperStreaming64.exe runs at above normal priority: it answers the game faster when the CPU is busy (weaker CPUs).
ServerAboveNormal=1

; --- Debug (leave everything at 0 for normal use) ---
; 1 = writes one line in ProperStreaming.log for each texture (big log).
LogTextures=0
; 1 = every 10s logs in ProperStreaming.log how textures are being sampled (mip, filter, shader).
Diagnostics=0
; 1 = compares each bridged texture with the one from the game's original reader and logs the differences.
SelfCheck=0
; 1 = every 60s logs the heaps, D3D buffers and streaming of the game executable.
MemReport=0
; 1 = every 60s logs how much memory each module allocated in the game executable (makes the game slower).
AllocTrace=0
