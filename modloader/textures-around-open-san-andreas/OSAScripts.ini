; OSAScripts - moves interior script logic (shopkeepers, buy markers, cameras) into OSA exteriors.
;
; [Zone.<name>]
;   Interior = enex name the scripts expect (GET_NAME_OF_ENTRY_EXIT_CHAR_USED), e.g. FDPIZA
;   Area     = interior id reported by GET_CHAR_AREA_VISIBLE while inside the zone
;   Shop     = shopping.dat section loaded on enter (GET_LOADED_SHOP), empty = none
;   Box      = world box minX,minY,minZ, maxX,maxY,maxZ - zone is active while CJ is inside it
;   Rotation = degrees, interior -> world rotation around Z (world = R * interior + offset)
;   Anchor   = ix,iy,iz, wx,wy,wz - one interior point and where it is in the world (sets the offset)
;   Virtual  = script names whose coordinates are transformed (they run in interior space)
;   Aware    = extra script names that only need to "see" the player inside the interior
;   PreviewN = model, ix,iy,iz, heading - stand-in ped (interior space) shown while CJ is near but outside;
;              removed when the shop script creates its own ped at that spot
;   PreviewRadius = metres from the zone centre at which stand-ins appear (default 80)
;   SubNBox      = ixmin,iymin, ixmax,iymax - part of the interior placed separately (N = 1..8); interior
;                  points inside it use SubNAnchor (and SubNRotation, default = Rotation) instead of Anchor.
;                  Headings follow the region of the thread's last transformed point.
;
; [Indoor.<name>]  rain is switched off (like a vanilla NO_RAIN cull zone) while the player or the camera
;   Box = minX,minY,minZ, maxX,maxY,maxZ   is inside Box AND has building collision above it, so the box
;                                          can be rough: open sky in it (street, doorway) stays rainy.
;   OutN = minX,minY,minZ, maxX,maxY,maxZ   (N = 1..8) parts of the Box that are outdoors under a roof
;          (galleries, porches): never counted as inside. Building collision and objects (skylight panes) are roofs.
;   Sky = sky colour of the vanilla interior-side enex (0 = off): under the roof the room gets the same
;         timecyc extra colour as the vanilla interior (ambient, ped light, post-fx), not the outdoor hour.
;   MapN = texture, x0,y0, x1,y1, zmin,zmax   radar floor plan (N = 1..8) from [General] RadarTxd for the
;          world rect NW corner x0,y0 -> SE corner x1,y1, drawn over the radar under the roof while CJ's z is
;          in [zmin, zmax)
;   MapRange = radar range in metres while a plan is shown (vanilla on foot: 180), default 60
;   Name = GXT key shown as the place name on entering (the vanilla enex name), NameText = literal text
;          for rooms that never had an enex
;   Audio = Audiozon.ipl box of the vanilla interior (name, or x,y,z inside it in interior space): its
;           ambience track / radio station and reverb play under the roof
;   Street = 1: street ambience (city noise, wind) always heard here (small shops); default 0 = muted
;            under the roof while all outer doors are shut (rooms without a door object keep it)
;   QuietN = minX,minY,minZ, maxX,maxY,maxZ   (N = 1..8) parts of the Box with no way to the street (cellars):
;            street ambience always muted there, whatever the doors and Street

[General]
; 1 = write every transformed opcode to OSAScripts.log
LogOpcodes=0
; metres checked above the player/camera for a ceiling in [Indoor.*] boxes
RoofRay=25
; texture dictionary (next to the .asi) with the [Indoor.*] MapN floor plans
RadarTxd=OSARadar.rtd
; door models that are always room doors, never street doors (Gen_doorINT01/02/03/05/04, Gen_wardrobe)
InnerDoors=1491,1492,1494,1499,1502,1567
