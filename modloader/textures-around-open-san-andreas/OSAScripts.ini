; [Area.<name>] Script = thread name, Area = interior: while the player is in Box the thread's SELECT_INTERIOR
; and SET_CHAR_AREA_VISIBLE / LINK_OBJECT/CAR_TO_INTERIOR with Area get 0, and SET_CHAR_HAS_USED_ENTRY_EXIT (08AD)
; leaves the ped in area 0. For vanilla interiors built at the building's own world position, so the mission
; coordinates fit as they are.
;   Offset   = dx,dy,dz - the interior is placed in the world moved by this (no rotation); then also
;   Interior = interior-space box: 3D points the thread passes inside it are moved by Offset (any player position)
;   Inside   = world box of the OSA rooms (more: Inside2..Inside8): 3D points the thread reads back inside it
;              are moved back, and GET_AREA_VISIBLE returns Area while the player is in it
;   AreaN    = interior reported for InsideN instead of Area (N 2..8; SELECT_INTERIOR/LINK_* with it also get 0)
;   SubNBox/SubNRotation/SubNAnchor (N 1..48) = parts placed separately: 3D points inside the source box go through
;              that rotation + anchor (source xyz -> world xyz), checked in order before Offset; may also be world
;              spots outside Interior that the mission must use elsewhere. 2D points follow the subs/Interior only
;              while the player is in Inside; read-back points come back through the sub whose source box they map to.
;   PointN   = fx,fy[,fz] : tx,ty[,tz] - one point replaced (source space, before the transform; without z = any z)
;   ActiveInterior = 1: GET_CHAR_ACTIVE_INTERIOR of the player returns Area while he is in Inside
;   Hold     = x,y,z: SET_CHAR_COORDINATES of the player to this point keeps him where he is (while in Inside)
;   StraightPaths = 1: TASK_FOLLOW_PATH_NODES_TO_COORD runs as TASK_GO_STRAIGHT_TO_COORD (path nodes through old walls)
;   Log      = 1: each distinct point the thread passes is logged once with CJ's position
; Save tutorial after Big Smoke (INTROST, main thread): waits for GET_AREA_VISIBLE == 3 with CJ within 10 m of the
; vanilla hall (2496.05,-1698.01,1013.75), shows the SAVE box from a hall camera, then wants area 0 near the front
; door to open the Ryder mission. OSA's CJ house = interior 3 at the same x/y, 1000 m lower (floor 2 cm higher).
