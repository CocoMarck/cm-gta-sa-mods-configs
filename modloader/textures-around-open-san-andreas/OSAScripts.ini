Area=3
Box=2470.0,-1730.0,0.0, 2525.0,-1670.0,60.0
Offset=0.0,0.0,-999.98
Interior=2480.0,-1720.0,1005.0, 2510.0,-1685.0,1030.0
Inside=2485.4,-1714.5,10.6, 2510.0,-1688.6,24.4

