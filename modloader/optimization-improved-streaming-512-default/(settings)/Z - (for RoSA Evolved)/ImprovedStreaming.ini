[Settings]
; Forces this streaming memory limit (the memory limit used to store files loaded into RAM, such as vehicles, world etc).
; In MB; the default is 50. The game supports up to 2048 (2 GB). Do not use 2048 (or close to it) without having "Largeaddress" installed (included in the Essentials Pack).
; You can find more information in the MixSets .ini file, but in short, you should set this number to the minimum necessary, with some margin. You need more if you use HD texture mods etc. You can see the usage using some mods, such as Open Limit Adjuster F5 key. It's normal for the game to reach its limit only after minutes of normal gameplay.
; It's exactly the same as MixSets and other mods do. The value here will replace the same value set in other mods.
; In some cases, if necessary, this mod will automatically increase this value for you, but it is recommended that you set it. It does NOT decrease it (if it is set higher in MixSets or another mod).
StreamMemoryForced = 2048

; The game will force the release of RAM by unloading unused models if it reaches a value above this total RAM memory of the game process.
; Normally the game has problems when RAM usage is close to or greater than 3.5 GB. For safety, a value like "3100" (3.1 GB) is stable, but if there are problems, such as the map stopping loading and textures disappearing from the pause menu, lower it even further.
MaxRAM = 3000

; Preloads all LODs (low definition objects seen from afar).
; This fixes holes in the map caused by delay in loading models.
PreLoadLODs = 1

; If the streaming memory usage exceeds this percentage, the mod will start to gradually flush unused models to free up memory.
; Originally the game only removes when it reaches the limit (which increases the work of streaming, delaying and causing stuttering), this function prevents the limit from being reached. The same will also be called if the "MaxRAM" is reached.
RemoveUnusedWhenPercent = 95

; Delay time to unload each unused model when reaching "RemoveUnusedWhenPercent".
; In case the memory usage is close to the limit, the mod will automatically halve the delay.
; You can use "0" to unload every frame, but this can also increase streaming work.
RemoveUnusedIntervalMs = 120

; 1 = Lists in the .log file all models being loaded. It will delay the game loading. Use it if you think a model is crashing when loading it, preferably with "LoadEach = 1" in the ranges below.
; 0 = Small .log file with little information (such as warnings).
; -1 = Does not generate .log.
LogMode = 0
